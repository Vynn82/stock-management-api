name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - uat
  pull_request:
    branches:
      - main
      - uat
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =======================================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # =======================================================
  ci:
    name: Code Quality, Tests & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & Code Quality Check
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Verify TypeScript Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Multi-Stage Production Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: stock-management-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =======================================================
  # 2. CONTINUOUS DEPLOYMENT (CD) TO AWS EC2
  # =======================================================
  deploy:
    name: Deploy to AWS EC2
    needs: [ci]
    # STRICT GUARD: Deploy ONLY runs if CI (lint, tests, build, docker) passed 100%
    if: |
      always() &&
      needs.ci.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code for Deploy Artifacts
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            APP_DIR="${APP_DIR:-/home/${{ secrets.EC2_USER }}/stock-management-api}"
            if [ ! -d "$APP_DIR" ]; then
              echo "Creating application directory at $APP_DIR..."
              mkdir -p "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            chmod +x deploy.sh
            ./deploy.sh
