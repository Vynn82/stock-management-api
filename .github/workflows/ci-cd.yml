name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - uat
  pull_request:
    branches:
      - main
      - uat
  workflow_dispatch:

# Do not cancel a running production deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # =======================================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # =======================================================
  ci:
    name: Code Quality, Tests & Container Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint & Code Quality Check
        run: npm run lint

      - name: Run Unit Tests
        run: npm test -- --runInBand

      - name: Verify TypeScript Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Production Docker Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =======================================================
  # 2. CONTINUOUS DEPLOYMENT (CD) TO AWS EC2
  # =======================================================
  deploy:
    name: Deploy to AWS EC2
    needs: [ci]

    # Production deployment only after a successful CI run on main.
    if: >-
      needs.ci.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    # Serialize production deployments.
    concurrency:
      group: stock-management-production
      cancel-in-progress: false

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -eu

            APP_DIR="/opt/stock-management-api"

            echo "Starting production deployment..."

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            # Preserve the known EC2-local deploy.sh edit, if present.
            # This workflow deploys directly and does not execute deploy.sh.
            if ! git diff --quiet -- deploy.sh; then
              git stash push -m "Preserve EC2-local deploy.sh edit" -- deploy.sh
            fi

            # Fail rather than silently overwrite other local changes.
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "ERROR: Other tracked local changes exist on EC2."
              git status --short
              exit 1
            fi

            # Fetch and fast-forward only; never force-reset the server.
            git pull --ff-only origin main

            echo "Building and starting production services..."

            sudo docker compose \
              -f docker-compose.prod.yml \
              up -d --build

            echo "Waiting for API health check..."

            for i in $(seq 1 30); do
              STATUS=$(sudo docker inspect \
                --format='{{.State.Health.Status}}' \
                stock-management-api 2>/dev/null || echo starting)

              if [ "$STATUS" = "healthy" ]; then
                echo "SUCCESS: API is healthy."
                sudo docker compose -f docker-compose.prod.yml ps
                exit 0
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "ERROR: API is unhealthy."
                sudo docker logs --tail 100 stock-management-api
                exit 1
              fi

              sleep 10
            done

            echo "ERROR: API did not become healthy in time."
            sudo docker compose -f docker-compose.prod.yml ps
            sudo docker logs --tail 100 stock-management-api
            exit 1
