services:
  postgres:
    image: postgres:16-alpine
    container_name: stock-management-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-stock-management-db}
      POSTGRES_USER: ${DB_USERNAME:-Vynn82}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USERNAME:-Vynn82} -d ${DB_DATABASE:-stock-management-db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stock_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-management-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - '3000:3000'
    healthcheck:
      test:
        ['CMD', 'curl', '-f', 'http://localhost:3000/products/import/template']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - stock_network

volumes:
  postgres_data:
    driver: local

networks:
  stock_network:
    driver: bridge
