api:
  image: ghcr.io/vynn82/stock-management-api:${IMAGE_TAG:-latest}
  container_name: stock-management-api
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
  env_file:
    - .env
  environment:
    NODE_ENV: production
    PORT: 3000
    DB_HOST: postgres
    DB_PORT: 5432
  ports:
    - '3000:3000'
  healthcheck:
    test:
      ['CMD', 'curl', '-f', 'http://localhost:3000/products/import/template']
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  networks:
    - stock_network
